name: Deploy PackShare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Auth Lambda
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Auth Lambda
        run: |
          cd auth
          pip install -r requirements.txt -t package/
          cp -r *.py utils/ package/
          cd package
          zip -r9 ../auth-lambda.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Deploy Auth Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.env.outputs.env }}-packshare-auth \
            --zip-file fileb://auth/auth-lambda.zip

      # Backend Lambda
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Backend Lambda
        run: |
          cd backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap ./cmd/lambda
          zip backend-lambda.zip bootstrap

      - name: Deploy Backend Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.env.outputs.env }}-packshare-backend \
            --zip-file fileb://backend/backend-lambda.zip

      # Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws s3 sync frontend/dist/ s3://${{ steps.env.outputs.env }}-packshare-frontend-${ACCOUNT_ID} --delete

      - name: Invalidate CloudFront
        run: |
          if [ "${{ steps.env.outputs.env }}" = "staging" ]; then
            aws cloudfront create-invalidation --distribution-id E2Q87J8EKCJCYB --paths "/*"
          fi
          # TODO: Add prod CloudFront ID when ready

      - name: Summary
        run: |
          echo "## ✅ Deployed to ${{ steps.env.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.env.outputs.env }}" = "staging" ]; then
            echo "**URL:** https://d3imer994mgg77.cloudfront.net" >> $GITHUB_STEP_SUMMARY
          fi
